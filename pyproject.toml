[project]
name = "dk"
version = "0.1.0"
description = "MacOS development environment manager."
readme = "README.md"
authors = [
    { name = "Joe Risner" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.85",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
dk = "dk.main:cli"

#################
##### Tools #####
#################

[tool.ruff]
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
select = [
    "F",     # pyflakes
    "E",     # pycodestyle
    "SIM",   # flake8-simplify
    "ARG",   # flake8-unused-arguments
    "PT",    # flake8-pytest-style
    "S",     # flake8-bandit
    "UP",    # pyupgrade
    "I",     # isort
    "N",     # pep8-naming
    "C901",  # mccabe complexity
    "PLR09"  # pylint-refactor-too-many
]
ignore = [
    "S603"   # allow `subprocess` invocation
]

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in __init__.py files
"__init__.py" = ["F401"]
