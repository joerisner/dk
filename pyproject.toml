[project]
name = "dk"
version = "0.1.0"
description = "CLI tool for conveniences in local development."
readme = "README.md"
authors = [
    { name = "Joe Risner" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
]

[project.scripts]
dk = "dk.main:cli"

[dependency-groups]
dev = [
    "ruff>=0.14.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

#################
##### Tools #####
#################

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
indent-style = "space"
quote-style = "double"

[tool.ruff.lint]
select = [
    "F",   # pyflakes
    "E",   # pycodestyle
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
    "I"    # isort
]

[tool.ruff.lint.per-file-ignores]
# Ignore unused imports in __init__.py files
"__init__.py" = ["F401"]
